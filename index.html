<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星穹秘境・塔羅占卜 (Mystic Celestial Tarot)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --color-gold: #f5d77f;
      --color-gold-glow: rgba(245, 215, 127, 0.4);
      --color-violet-glow: rgba(168, 85, 247, 0.35);
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background: radial-gradient(ellipse at 50% 20%, #1e113a 0%, #0d081f 50%, #05020c 100%);
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    .font-cinzel {
      font-family: 'Cinzel Decorative', cursive;
    }

    /* 3D Perspective for Cards */
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(13, 8, 31, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.7);
    }

    /* Celestial Glow & Animations */
    .gold-glow {
      box-shadow: 0 0 25px rgba(245, 215, 127, 0.25), inset 0 0 15px rgba(245, 215, 127, 0.15);
    }

    .gold-border {
      border: 1px solid rgba(245, 215, 127, 0.35);
    }

    .card-hover-fx {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover-fx:hover {
      transform: translateY(-20px) scale(1.06);
      filter: drop-shadow(0 15px 25px rgba(216, 180, 254, 0.5));
      z-index: 50;
    }

    @keyframes pulse-halo {
      0%, 100% {
        box-shadow: 0 0 20px rgba(192, 132, 252, 0.3), 0 0 40px rgba(245, 215, 127, 0.2);
      }
      50% {
        box-shadow: 0 0 35px rgba(192, 132, 252, 0.5), 0 0 60px rgba(245, 215, 127, 0.45);
      }
    }

    .pulse-glow {
      animation: pulse-halo 4s infinite ease-in-out;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .shimmer-text {
      background: linear-gradient(90deg, #e9d5ff 0%, #fef08a 50%, #e9d5ff 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: shimmer 6s linear infinite;
    }

    /* Card Back Geometric Pattern */
    .tarot-back-pattern {
      background: radial-gradient(circle at 50% 50%, #2e1065 0%, #0f0728 100%);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(245, 215, 127, 0.15) 1px, transparent 1px),
        linear-gradient(45deg, rgba(168, 85, 247, 0.08) 25%, transparent 25%, transparent 75%, rgba(168, 85, 247, 0.08) 75%),
        linear-gradient(-45deg, rgba(168, 85, 247, 0.08) 25%, transparent 25%, transparent 75%, rgba(168, 85, 247, 0.08) 75%);
      background-size: 16px 16px, 32px 32px, 32px 32px;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between text-slate-100">

  <!-- Background Particle & Nebula Canvas -->
  <canvas id="nebulaCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Sound Toggle & Toast Notification -->
  <div class="fixed top-5 right-5 z-50 flex items-center gap-3">
    <button id="soundToggleBtn" onclick="toggleAudio()" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-950/70 border border-purple-500/40 hover:border-amber-300 text-xs text-amber-200 transition-all backdrop-blur-md shadow-lg">
      <i data-lucide="volume-2" id="soundIcon" class="w-4 h-4"></i>
      <span id="soundStatusText">音效：開啟</span>
    </button>
  </div>

  <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-violet-950/90 border border-amber-300/60 text-amber-100 text-sm shadow-2xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
    <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
    <span id="toastMsg">已複製占卜啟示</span>
  </div>

  <!-- Header -->
  <header class="relative z-10 pt-10 pb-4 px-4 text-center">
    <div class="inline-flex items-center justify-center gap-2 mb-2">
      <span class="h-px w-12 bg-gradient-to-r from-transparent to-amber-300/60"></span>
      <span class="text-xs uppercase tracking-[0.3em] text-amber-300/80 font-cinzel">Celestial Oracle</span>
      <span class="h-px w-12 bg-gradient-to-l from-transparent to-amber-300/60"></span>
    </div>
    <h1 class="text-3xl sm:text-5xl font-black tracking-wider shimmer-text mb-3">星穹秘境・塔羅占卜</h1>
    <p class="text-sm sm:text-base text-purple-200/70 max-w-xl mx-auto font-light leading-relaxed">
      洗淨雜念，靜心傾聽靈魂深處的微光。翻開阿爾卡那之門，洞悉命運流轉與宇宙指引。
    </p>
  </header>

  <!-- Main Ritual & Reading Stage -->
  <main class="relative z-10 flex-grow container mx-auto px-4 py-4 max-w-5xl flex flex-col items-center">
    
    <!-- STEP 1: Preparation (Question & Spread Selection) -->
    <section id="prepSection" class="w-full max-w-2xl bg-indigo-950/40 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl pulse-glow mb-6 transition-all duration-500">
      
      <!-- Spread Selector -->
      <label class="block text-xs uppercase tracking-widest text-amber-300/90 mb-3 font-semibold text-center">
        ✦ 選擇靈性牌陣 ✦
      </label>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
        <button type="button" onclick="selectSpread('single')" id="spread-single" class="spread-btn px-4 py-3 rounded-2xl border text-sm font-medium transition-all flex flex-col items-center gap-1.5 bg-purple-900/40 border-amber-400 text-amber-200 shadow-md">
          <i data-lucide="sparkle" class="w-5 h-5 text-amber-300"></i>
          <span>每日單牌指引</span>
          <span class="text-[11px] text-purple-300/70">直覺解答・即時指引</span>
        </button>
        <button type="button" onclick="selectSpread('three')" id="spread-three" class="spread-btn px-4 py-3 rounded-2xl border text-sm font-medium transition-all flex flex-col items-center gap-1.5 bg-indigo-950/50 border-purple-500/30 text-purple-200/80 hover:border-purple-400">
          <i data-lucide="hourglass" class="w-5 h-5 text-purple-300"></i>
          <span>時間之流三牌陣</span>
          <span class="text-[11px] text-purple-300/70">過去・現在・未來</span>
        </button>
        <button type="button" onclick="selectSpread('love')" id="spread-love" class="spread-btn px-4 py-3 rounded-2xl border text-sm font-medium transition-all flex flex-col items-center gap-1.5 bg-indigo-950/50 border-purple-500/30 text-purple-200/80 hover:border-purple-400">
          <i data-lucide="heart" class="w-5 h-5 text-rose-300"></i>
          <span>情感心靈之鏡</span>
          <span class="text-[11px] text-purple-300/70">自己・對方・羈絆建議</span>

      </div>

      <div class="mb-6">
        <label for="userQuestion" class="block text-xs uppercase tracking-widest text-amber-300/90 mb-2 font-semibold flex items-center justify-between">

        </label>
        <div class="relative">
          <input type="text" id="userQuestion" placeholder="例如：我近期在事業/戀愛上的心靈方向是什麼？"

        </div>

    </section>

      </div>

      <div id="deckFanContainer" class="w-full h-72 sm:h-80 relative flex items-center justify-center overflow-x-auto overflow-y-visible px-4 py-8">
        <!-- Interactive Arc Generated via JS -->
      </div>

      <!-- Picked status slot counter -->
      <div id="selectedSlotsDisplay" class="flex gap-4 items-center justify-center mt-6">
        <!-- Slots indicators injected by JS -->
      </div>
    </section>

    <!-- STEP 3: Reading Reveal Section (Hidden Initially) -->
    <section id="readingSection" class="w-full max-w-4xl hidden flex-col items-center">
      
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-amber-400/10 border border-amber-300/30 text-amber-300 text-xs mb-2">
          <i data-lucide="stars" class="w-3.5 h-3.5"></i>
          <span>星象啟示已然顯現</span>
        </div>
        <h2 id="readingQuestionHeadline" class="text-xl sm:text-2xl text-purple-100 font-bold"></h2>
      </div>

      <!-- Display Cards (Spread Grid) -->
      <div id="cardsDisplayContainer" class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8 mb-10">
        <!-- Revealed card components inserted here -->
      </div>

      <!-- Comprehensive Synthesis / Reflection Box -->
      <div class="w-full bg-purple-950/40 border border-purple-500/30 rounded-3xl p-6 sm:p-8 backdrop-blur-md shadow-2xl mb-10 gold-glow">
        <div class="flex items-center gap-3 mb-4 text-amber-300">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
          <h3 class="text-lg font-bold tracking-wide">星穹心靈指引・總結</h3>
        </div>
        <p id="spreadSynthesisText" class="text-purple-100/90 leading-relaxed text-sm sm:text-base font-light mb-4"></p>
        <div class="pt-4 border-t border-purple-500/20 flex flex-wrap gap-2 text-xs text-purple-300/70" id="readingKeywords"></div>
      </div>

      <!-- Action Bottom Bar -->
      <div class="flex flex-wrap items-center justify-center gap-4 w-full">
        <button onclick="copyReadingSummary()" class="px-6 py-3 rounded-2xl bg-indigo-900/60 hover:bg-indigo-800/80 border border-purple-400/40 text-amber-200 text-sm font-medium transition-all flex items-center gap-2 shadow-md">
          <i data-lucide="copy" class="w-4 h-4"></i>
          <span>複製占卜解讀</span>
        </button>
        <button onclick="resetReading()" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-amber-300 hover:from-amber-300 hover:to-amber-200 text-purple-950 text-sm font-bold transition-all flex items-center gap-2 shadow-md hover:scale-105">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          <span>重新占卜</span>
        </button>
      </div>

    </section>

  </main>

  <!-- Card Detail Modal -->

    <div class="bg-gradient-to-b from-indigo-950 to-purple-950 border border-amber-300/40 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-purple-300 hover:text-amber-300 p-2 rounded-full hover:bg-purple-900/50 transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Footer -->

    <p>© 2026 星穹秘境・牌意象徵源自傳統萊德偉特大阿爾卡那・願星光常伴心側</p>
  </footer>

        roles: ["宇宙當下指引"]
      },
      three: {
        id: "three",
        name: "時間之流三牌陣",
        count: 3,
        roles: ["【過去】根源與影響", "【現在】核心現況", "【未來】趨向與指引"]
      },
      love: {
        id: "love",
        name: "情感心靈之鏡",
        count: 3,
        roles: ["【心之本體】你的心境與真實渴求", "【對象之影】對方的投射與能量狀態", "【合一之道】雙方的關鍵契機與神聖指引"]
      }
    };

    let currentSpreadKey = 'single';
    let currentQuestion = '';
    let selectedCards = []; // Array of { cardData, isReversed, role }
    let isDrawing = false;
    let audioEnabled = true;

    /* =========================================================================
       3. Web Audio Celestial Sound Synthesizer
       ========================================================================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCelestialChime(freq = 528, duration = 1.6, type = 'sine') {
      if (!audioEnabled) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        // Exponential frequency decay for chime sparkle
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.1);
        osc.frequency.exponentialRampToValueAtTime(freq, now + 0.4);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {
        console.warn("Audio error", e);
      }
    }

    function playShuffleSound() {
      if (!audioEnabled) return;
      try {
        initAudio();
        const notes = [432, 528, 639, 741, 852];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            playCelestialChime(freq, 0.8, 'triangle');
          }, idx * 70);
        });
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const icon = document.getElementById('soundIcon');
      const text = document.getElementById('soundStatusText');
      if (audioEnabled) {
        initAudio();
        playCelestialChime(659, 1);
        text.innerText = "音效：開啟";
        icon.setAttribute('data-lucide', 'volume-2');
      } else {
        text.innerText = "音效：靜音";
        icon.setAttribute('data-lucide', 'volume-x');
      }
      lucide.createIcons();
    }

    /* =========================================================================
       4. Canvas Particle Nebula Ambience
       ========================================================================= */
    const canvas = document.getElementById('nebulaCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const numStars = Math.floor((canvas.width * canvas.height) / 8000);
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.3,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.008 + 0.003,
          phase: Math.random() * Math.PI * 2,
          color: Math.random() > 0.4 ? '#fef08a' : (Math.random() > 0.5 ? '#e9d5ff' : '#bae6fd')
        });
      }
    }

    function renderNebula() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw subtle twinkling stars
      stars.forEach(star => {
        star.phase += star.speed;
        const currentAlpha = (Math.sin(star.phase) + 1) / 2 * star.alpha;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.globalAlpha = currentAlpha;
        ctx.shadowBlur = star.radius > 1 ? 6 : 0;
        ctx.shadowColor = star.color;
        ctx.fill();
      });

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      requestAnimationFrame(renderNebula);
    }

    window.addEventListener('resize', resizeCanvas);

    /* =========================================================================
       5. Interaction & Ritual Workflow
       ========================================================================= */
    function selectSpread(spreadKey) {
      currentSpreadKey = spreadKey;
      playCelestialChime(440, 0.4);
      document.querySelectorAll('.spread-btn').forEach(btn => {
        btn.classList.remove('bg-purple-900/40', 'border-amber-400', 'text-amber-200');
        btn.classList.add('bg-indigo-950/50', 'border-purple-500/30', 'text-purple-200/80');
      });

      const activeBtn = document.getElementById(`spread-${spreadKey}`);
      activeBtn.classList.remove('bg-indigo-950/50', 'border-purple-500/30', 'text-purple-200/80');
      activeBtn.classList.add('bg-purple-900/40', 'border-amber-400', 'text-amber-200');
    }

    function startRitual() {
      initAudio();
      playShuffleSound();

      const qInput = document.getElementById('userQuestion');
      currentQuestion = qInput.value.trim() || "探索當前生命頻率與指引";
      selectedCards = [];
      isDrawing = false;

      // Switch views
      document.getElementById('prepSection').classList.add('hidden');
      document.getElementById('deckSection').classList.remove('hidden');

      document.getElementById('currentQuestionDisplay').innerText = `「 ${currentQuestion} 」`;
      updateSelectionProgress();
      renderDeckFan();
    }

    function updateSelectionProgress() {
      const spread = SPREADS[currentSpreadKey];
      const remaining = spread.count - selectedCards.length;
      const badge = document.getElementById('pickInstructionBadge');
      const slotsContainer = document.getElementById('selectedSlotsDisplay');

      if (remaining > 0) {
        badge.innerHTML = `✦ 請直覺挑選第 <span class="font-bold text-amber-300">${selectedCards.length + 1}</span> 張牌（剩餘 ${remaining} 張）✦`;
      } else {
        badge.innerHTML = `✦ 牌陣已圓滿契合，引導啟示中... ✦`;
      }

      // Render mini slots indicators
      slotsContainer.innerHTML = '';
      for (let i = 0; i < spread.count; i++) {
        const isPicked = i < selectedCards.length;
        const slotEl = document.createElement('div');
        slotEl.className = `px-3 py-1.5 rounded-xl border text-xs flex items-center gap-2 transition-all duration-300 ${
          isPicked 
            ? 'bg-amber-400/20 border-amber-400 text-amber-200 scale-105' 
            : 'bg-purple-950/30 border-purple-500/30 text-purple-400/60'
        }`;
        slotEl.innerHTML = `
          <i data-lucide="${isPicked ? 'check-circle' : 'circle'}" class="w-3.5 h-3.5"></i>
          <span>${spread.roles[i]}</span>
        `;
        slotsContainer.appendChild(slotEl);
      }
      lucide.createIcons();
    }

    /* Render interactive 22 cards Arc in Fan */
    function renderDeckFan() {
      const container = document.getElementById('deckFanContainer');
      container.innerHTML = '';

      // Random pool of available indices
      const availableIndices = Array.from({ length: 22 }, (_, i) => i)
        .sort(() => Math.random() - 0.5);

      const totalCards = 22;
      const fanAngleRange = 60; // Spread arc degrees
      const stepAngle = fanAngleRange / (totalCards - 1);
      const startAngle = -(fanAngleRange / 2);

      availableIndices.forEach((cardPoolIndex, idx) => {
        const cardAngle = startAngle + idx * stepAngle;
        const translateY = Math.abs(cardAngle) * 0.9;

        const cardWrapper = document.createElement('div');
        cardWrapper.className = `absolute cursor-pointer transition-all duration-300 select-none`;
        cardWrapper.style.transform = `rotate(${cardAngle}deg) translateY(${translateY}px)`;
        cardWrapper.style.left = `calc(50% - 36px + ${(idx - 10.5) * 22}px)`;
        cardWrapper.style.transformOrigin = 'bottom center';
        cardWrapper.style.zIndex = idx + 1;

        cardWrapper.innerHTML = `
          <div class="card-hover-fx w-20 sm:w-24 h-32 sm:h-36 rounded-xl tarot-back-pattern gold-border p-1 shadow-xl flex flex-col justify-between items-center text-center">
            <div class="w-full flex justify-between px-1 text-[9px] text-amber-200/50">✦ ✦</div>
            <div class="w-8 h-8 rounded-full border border-amber-300/40 flex items-center justify-center text-amber-300/70">
              <i data-lucide="sun-medium" class="w-4 h-4"></i>
            </div>
            <div class="text-[9px] tracking-widest text-amber-300/60 font-cinzel">TAROT</div>
          </div>
        `;

        cardWrapper.onclick = () => handleCardPick(cardWrapper, cardPoolIndex);
        container.appendChild(cardWrapper);
      });
      lucide.createIcons();
    }

    function handleCardPick(element, cardIndex) {
      if (isDrawing) return;
      const spread = SPREADS[currentSpreadKey];
      if (selectedCards.length >= spread.count) return;

      isDrawing = true;
      playCelestialChime(580 + selectedCards.length * 120, 1.2);

      // Upright or reversed determination (approx 30% reversed for balanced mystical touch)
      const isReversed = Math.random() < 0.32;
      const role = spread.roles[selectedCards.length];
      const cardData = TAROT_CARDS[cardIndex];

      selectedCards.push({ cardData, isReversed, role });

      // Visual animation on chosen card
      element.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
      element.style.transform = 'translateY(-60px) scale(1.2) rotate(0deg)';
      element.style.opacity = '0';
      element.style.pointerEvents = 'none';

      updateSelectionProgress();

      setTimeout(() => {
        isDrawing = false;
        if (selectedCards.length >= spread.count) {
          revealAllReadings();
        }
      }, 700);
    }

    /* =========================================================================
       6. Reveal Readings & 3D Flipping
       ========================================================================= */
    function revealAllReadings() {
      playCelestialChime(784, 2, 'triangle');
      document.getElementById('deckSection').classList.add('hidden');
      const readingSection = document.getElementById('readingSection');
      readingSection.classList.remove('hidden');

      document.getElementById('readingQuestionHeadline').innerText = `「 ${currentQuestion} 」`;

      const cardsContainer = document.getElementById('cardsDisplayContainer');
      cardsContainer.innerHTML = '';

      selectedCards.forEach((item, index) => {
        const cardBox = document.createElement('div');
        cardBox.className = 'flex flex-col items-center';

        const interpretation = item.isReversed ? item.cardData.reversed : item.cardData.upright;
        const statusLabel = item.isReversed ? '逆位 (Reversed)' : '正位 (Upright)';
        const statusColor = item.isReversed ? 'text-amber-400 bg-amber-950/60 border-amber-400/40' : 'text-emerald-300 bg-emerald-950/60 border-emerald-400/40';

        cardBox.innerHTML = `
          <!-- Position Title Badge -->
          <div class="mb-3 px-3 py-1 rounded-full bg-purple-900/60 border border-purple-400/30 text-amber-200 text-xs font-semibold tracking-wider text-center">
            ${item.role}
          </div>

          <!-- 3D Flippable Card Frame -->
          <div class="perspective-1000 w-56 sm:w-64 h-84 sm:h-96 relative group cursor-pointer" onclick="openDetailModal(${index})">
            <div id="flipCardInner-${index}" class="w-full h-full transform-style-3d transition-transform duration-1000 ease-out relative">
              
              <!-- Card Back -->
              <div class="absolute inset-0 w-full h-full rounded-2xl tarot-back-pattern gold-border p-3 shadow-2xl flex flex-col justify-between items-center backface-hidden">
                <div class="w-full flex justify-between text-xs text-amber-300/50"><span>✦</span><span>✦</span></div>
                <div class="w-16 h-16 rounded-full border border-amber-300/40 flex items-center justify-center text-amber-300">
                  <i data-lucide="sparkles" class="w-8 h-8"></i>
                </div>
                <div class="text-xs tracking-widest text-amber-300/70 font-cinzel">ARCANUM</div>
              </div>

              <!-- Card Front -->
              <div class="absolute inset-0 w-full h-full rounded-2xl bg-gradient-to-b from-[#1b1035] via-[#120a26] to-[#0a0518] gold-border p-4 shadow-2xl flex flex-col justify-between items-center rotate-y-180 backface-hidden gold-glow ${item.isReversed ? 'border-amber-400/60' : 'border-amber-300/60'}">
                
                <!-- Card Top Info -->
                <div class="w-full flex justify-between items-center text-xs text-amber-300/80 font-cinzel">
                  <span>${item.cardData.roman}</span>
                  <span class="text-[10px] tracking-wider text-purple-300/70">${item.cardData.planet}</span>
                </div>

                <!-- Card Center Symbol Illustration -->
                <div class="my-auto flex flex-col items-center justify-center transform transition-transform duration-500 ${item.isReversed ? 'rotate-180' : ''}">
                  <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-tr from-purple-900/60 to-amber-500/20 border border-amber-300/40 flex items-center justify-center text-amber-200 mb-2 shadow-inner">
                    <i data-lucide="${item.cardData.icon}" class="w-10 h-10 sm:w-12 sm:h-12 text-amber-300"></i>
                  </div>
                  <span class="text-2xl text-amber-300/90 font-cinzel">${item.cardData.symbol}</span>
                </div>

                <!-- Card Bottom Name -->
                <div class="w-full text-center pt-2 border-t border-purple-500/20">
                  <h4 class="text-base sm:text-lg font-bold text-amber-100 tracking-wider">${item.cardData.name}</h4>
                  <p class="text-[10px] tracking-wider text-purple-300/70 uppercase">${item.cardData.eng}</p>
                </div>
              </div>

            </div>
          </div>

          <!-- Card Summary Underneath -->
          <div class="mt-4 text-center max-w-xs">
            <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold border ${statusColor} mb-2">
              ${statusLabel}
            </span>
            <p class="text-xs text-amber-200 font-medium mb-1">${interpretation.title}</p>
            <p class="text-xs text-purple-300/80 line-clamp-3 leading-relaxed">${interpretation.meaning}</p>
            <button onclick="openDetailModal(${index})" class="mt-2 text-xs text-amber-300/90 hover:text-amber-200 underline underline-offset-4 flex items-center justify-center gap-1 mx-auto">
              <span>深入牌義與指引</span>
              <i data-lucide="chevron-right" class="w-3 h-3"></i>
            </button>
          </div>
        `;

        cardsContainer.appendChild(cardBox);

        // Trigger 3D flip animation sequentially
        setTimeout(() => {
          const inner = document.getElementById(`flipCardInner-${index}`);
          if (inner) {
            inner.style.transform = 'rotateY(180deg)';
            playCelestialChime(500 + index * 180, 0.9);
          }
        }, 350 + index * 300);
      });

      // Build Synthesis Summary
      generateSynthesis();
      lucide.createIcons();
    }

    /* =========================================================================
       7. Interpretation Synthesis & Details
       ========================================================================= */
    function generateSynthesis() {
      const synTextEl = document.getElementById('spreadSynthesisText');
      const kwContainer = document.getElementById('readingKeywords');

      let allKeywords = [];
      let summaryText = "";

      selectedCards.forEach(item => {
        const info = item.isReversed ? item.cardData.reversed : item.cardData.upright;
        allKeywords.push(...info.keywords);
      });

      // Remove duplicate keywords & slice top 8
      const uniqueKeywords = [...new Set(allKeywords)].slice(0, 8);

      if (currentSpreadKey === 'single') {
        const item = selectedCards[0];
        const info = item.isReversed ? item.cardData.reversed : item.cardData.upright;
        summaryText = `【星辰回響】：就你所掛念的「${currentQuestion}」，抽出的《${item.cardData.name}・${item.isReversed ? '逆位' : '正位'}》指示當前關鍵在於「${info.title}」。${info.advice} 請放寬心靈，這張牌提醒你將焦點回歸自身本源力量。`;
      } else if (currentSpreadKey === 'three') {
        const [past, pres, fut] = selectedCards;
        summaryText = `【時流解析】：回望過去，受到《${past.cardData.name}》的基石洗禮；在當下此刻，《${pres.cardData.name}・${pres.isReversed ? '逆位' : '正位'}》呈現出你正在整合的關鍵焦點；而未來的能量正向《${fut.cardData.name}》延伸。宇宙提示你：接納過往的沈澱，不抗拒當前的修煉，命運的下一步將撥雲見日。`;
      } else {
        const [self, other, bond] = selectedCards;
        summaryText = `【心靈鏡照】：在彼此的能量場中，你的心境呼應著《${self.cardData.name}》，對方的狀態則倒映出《${other.cardData.name}》。兩人靈性羈絆的指引牌為《${bond.cardData.name}・${bond.isReversed ? '逆位' : '正位'}》。請以愛與真誠為引，照料彼此的脆弱，放下控制心，讓信任自然流轉。`;
      }

      synTextEl.innerText = summaryText;

      kwContainer.innerHTML = '<span class="text-amber-300 font-semibold">靈性關鍵字：</span>';
      uniqueKeywords.forEach(kw => {
        const tag = document.createElement('span');
        tag.className = 'px-2 py-0.5 rounded-md bg-purple-900/50 border border-purple-500/30 text-purple-200';
        tag.innerText = `#${kw}`;
        kwContainer.appendChild(tag);
      });
    }

    function openDetailModal(cardIndex) {
      const item = selectedCards[cardIndex];
      if (!item) return;
      playCelestialChime(660, 0.5);

      const interpretation = item.isReversed ? item.cardData.reversed : item.cardData.upright;
      const modalContent = document.getElementById('modalContent');

      modalContent.innerHTML = `
        <div class="text-center pb-4 border-b border-purple-500/20">
          <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-purple-900/60 border border-amber-300/40 text-amber-300 text-xs mb-2">
            <span>${item.role}</span>
          </div>
          <h3 class="text-2xl font-bold text-amber-100">${item.cardData.name} (${item.cardData.roman})</h3>
          <p class="text-xs uppercase tracking-wider text-purple-300/70">${item.cardData.eng}・${item.cardData.planet}</p>
          <div class="mt-2 inline-block px-3 py-0.5 rounded-full text-xs font-semibold border ${item.isReversed ? 'text-amber-400 bg-amber-950/60 border-amber-400/40' : 'text-emerald-300 bg-emerald-950/60 border-emerald-400/40'}">
            ${item.isReversed ? '逆位 (Reversed)' : '正位 (Upright)'}：${interpretation.title}
          </div>
        </div>

        <div class="py-4 space-y-4 text-sm text-purple-100">
          <div>
            <h4 class="text-xs font-semibold text-amber-300 tracking-wider mb-1 flex items-center gap-1">
              <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
              <span>牌面象徵與靈魂牌義</span>
            </h4>
            <p class="text-purple-200/90 leading-relaxed font-light">${interpretation.meaning}</p>
          </div>

          <div>
            <h4 class="text-xs font-semibold text-amber-300 tracking-wider mb-1 flex items-center gap-1">
              <i data-lucide="compass" class="w-3.5 h-3.5"></i>
              <span>宇宙神聖指引</span>
            </h4>
            <p class="text-purple-200/90 leading-relaxed font-light">${interpretation.advice}</p>
          </div>

          <div>
            <h4 class="text-xs font-semibold text-amber-300 tracking-wider mb-1 flex items-center gap-1">
              <i data-lucide="tag" class="w-3.5 h-3.5"></i>
              <span>相關意涵關鍵字</span>
            </h4>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${interpretation.keywords.map(kw => `<span class="px-2 py-0.5 rounded bg-purple-900/60 border border-purple-500/40 text-[11px] text-amber-200">#${kw}</span>`).join('')}
            </div>
          </div>
        </div>

        <div class="pt-3 text-center border-t border-purple-500/20">
          <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-purple-900/60 hover:bg-purple-800 text-amber-200 text-xs font-semibold tracking-wider transition border border-purple-400/30">
            合十・敬謝啟示
          </button>
        </div>
      `;

      const modal = document.getElementById('detailModal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById('detailModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    // Dismiss modal on background click
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    });

    /* =========================================================================
       8. Copy / Share & Reset
       ========================================================================= */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    function copyReadingSummary() {
      let text = `【星穹秘境・塔羅占卜解讀】\n`;
      text += `✦ 詢問意念：${currentQuestion}\n`;
      text += `✦ 牌陣類型：${SPREADS[currentSpreadKey].name}\n\n`;

      selectedCards.forEach(item => {
        const info = item.isReversed ? item.cardData.reversed : item.cardData.upright;
        text += `【${item.role}】：${item.cardData.name} (${item.isReversed ? '逆位' : '正位'})\n`;
        text += `・核心牌義：${info.title}\n`;
        text += `・啟示引導：${info.advice}\n\n`;
      });

      const syn = document.getElementById('spreadSynthesisText').innerText;
      text += `${syn}\n\n願星辰之光照耀前路 ✨`;

      // Fallback copy using hidden textarea
      const tempArea = document.createElement('textarea');
      tempArea.value = text;
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        showToast('占卜解讀已成功複製至剪貼簿！');
        playCelestialChime(880, 0.6);
      } catch (err) {
        showToast('複製失敗，請手動選取文字');
      }
      document.body.removeChild(tempArea);
    }

    function resetReading() {
      playCelestialChime(440, 0.4);
      selectedCards = [];
      document.getElementById('readingSection').classList.add('hidden');
      document.getElementById('deckSection').classList.add('hidden');
      document.getElementById('prepSection').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* Initialize Application on Load */
    window.onload = function () {
      resizeCanvas();
      renderNebula();
      lucide.createIcons();
    };
  </script>
