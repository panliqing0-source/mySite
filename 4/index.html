    // 取得當前週的日期範圍顯示
    function setWeekDateRange() {
      const now = new Date();
      const first = now.getDate() - now.getDay() + 1; // Monday
      const last = first + 6; // Sunday

      const monday = new Date(now.setDate(first));
      const sunday = new Date(now.setDate(last));

      const formatDate = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      document.getElementById("week-date-range").innerText = `${formatDate(monday)} - ${formatDate(sunday)} 本週運勢`;
    }

    // 渲染星座選擇按鈕
    function renderZodiacGrid(filter = 'all') {
      const grid = document.getElementById('zodiac-grid');
      grid.innerHTML = '';

      zodiacData.forEach(item => {
        if (filter !== 'all' && item.element !== filter) return;

        const isActive = item.id === currentSelectedSign;
        const btn = document.createElement('button');
        btn.className = `sign-btn bubble-card rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer ${isActive ? 'active bg-white' : 'hover:bg-white/90'}`;
        btn.onclick = () => selectZodiac(item.id);

        btn.innerHTML = `
          <div class="text-3xl mb-1">${item.avatar}</div>
          <div class="font-bold text-slate-800 text-sm">${item.name}</div>
          <div class="text-[10px] text-slate-400 font-sans">${item.date}</div>
        `;
        grid.appendChild(btn);
      });
    }

    // 切換選取的星座並更新視圖
    function selectZodiac(id) {
      currentSelectedSign = id;
      renderZodiacGrid(getCurrentFilter());
      renderFortuneDetail(id);
    }

    // 獲取當前 Element Filter
    function getCurrentFilter() {
      const activeFilterBtn = document.querySelector('.element-filter.bg-pink-400');
      if (!activeFilterBtn) return 'all';
      const text = activeFilterBtn.innerText;
      if (text.includes('火')) return '火';
      if (text.includes('土')) return '土';
      if (text.includes('風')) return '風';
      if (text.includes('水')) return '水';
      return 'all';
    }

    // 元素分類篩選器點擊事件
    function filterElement(element) {
      const btns = document.querySelectorAll('.element-filter');
      btns.forEach(btn => {
        btn.className = "element-filter px-4 py-1.5 rounded-full bg-white text-slate-500 shadow-sm border border-slate-200 hover:bg-slate-50 transition";
      });

      event.target.className = "element-filter active px-4 py-1.5 rounded-full bg-pink-400 text-white shadow-md hover:opacity-90 transition";
      renderZodiacGrid(element);
    }

    // 生成星星 HTML

      let stars = '';
      for (let i = 1; i <= 5; i++) {
        if (i <= score) {
          stars += `<i class="fa-solid fa-star text-amber-400 text-lg"></i>`;
        } else {
          stars += `<i class="fa-regular fa-star text-slate-300 text-lg"></i>`;
        }
      }
      return stars;
    }

    // 抽籤互動功能
    function drawFortune() {
      const btn = document.getElementById('draw-btn');
      const result = document.getElementById('draw-result');

      btn.disabled = true;
      btn.classList.add('opacity-75');
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-2"></i> 誠心祈禱中...`;

      setTimeout(() => {
        const randomItem = fortuneStickData[Math.floor(Math.random() * fortuneStickData.length)];
        
        document.getElementById('draw-emoji').innerText = randomItem.emoji;
        document.getElementById('draw-title').innerText = randomItem.title;
        document.getElementById('draw-desc').innerText = randomItem.desc;

        result.classList.remove('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-75');
        btn.innerHTML = `<i class="fa-solid fa-rotate-right mr-2"></i> 再抽一次`;
      }, 800);
    }

    // 頁面初始化
    window.onload = function() {
